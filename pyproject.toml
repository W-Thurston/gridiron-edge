[project]
name = "nfl-predict"
version = "0.1.0"
description = "NFL game prediction: Elo ratings, Monte Carlo simulation, and betting edge discovery."
authors = [{ name = "W-Thurston", email = "WilliamD.Thurston@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4"

dependencies = [
    "pyyaml>=6.0.2,<7.0.0",
    "pandas>=2.3.2,<3.0.0",
    "timezonefinder>=8.0.0,<9.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "geopy>=2.4.1,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "multiprocess>=0.70.18,<0.71.0",
    "plottable>=0.1.5,<0.2.0",
    "seaborn>=0.13.2,<0.14.0",
    "numba>=0.63.1,<0.64.0",
    "typer>=0.21.1,<0.22.0",
    "pyarrow>=19.0.0",
    "matplotlib>=3.10.0",
    "pytz>=2025.2",
    "requests>=2.32.0",
    "urllib3>=2.3.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "nflreadpy>=0.1.5",
    "fastapi>=0.138.1",
    "httpx2>=2.5.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
gridiron = "gridiron_edge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridiron_edge"]

# ===========================================================================
# UV
# ===========================================================================

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "ipykernel>=6.30.1,<7.0.0",
    "ruff>=0.9.0",
    "pyrefly>=0.1.0",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
]

# ===========================================================================
# PYTEST
# ===========================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Treat "no tests collected" as success (exit code 0 instead of 5)
addopts = "--strict-markers -v"
markers = [
    "unit: Fast isolated tests, no I/O or network",
    "integration: Cross-module tests, may use tmp_path filesystem",
    "e2e: End-to-end CLI or pipeline tests",
    "slow: Tests that take >5 seconds",
    "network: Tests requiring network access (nflverse, OpenWeather, DraftKings)",
]



[tool.coverage.run]
source = ["src/gridiron_edge"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 40
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]


# ===========================================================================
# RUFF
# ===========================================================================

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = [
    "scripts/",
    "skills/"
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific rules
    "N",    # pep8-naming
    "D",    # pydocstring (Google style)
    "ANN",  # flake8-annotations (type hints)
    "PLR",  # pylint refactor
    "PLW",  # pylint warnings
]
ignore = [
    "D100",    # Missing docstring in public module - too noisy for __init__.py files
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in __init__ - handled at class level
    "ANN204",  # Missing return type for __init__
    "N999",    # Invalid module name - repo name NFL_Predict triggers this; not actionable
    "PLR0913", # Too many arguments - numba kernels legitimately need many
    "PLR2004", # Magic value comparisons - acceptable in numba/sports context
    "ANN101",  # Missing type annotation for `self` in method - REMOVED
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["gridiron_edge"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",    # No docstring requirements in tests
    "ANN",  # No annotation requirements in tests
]
"notebooks/**" = [
    "D",
    "ANN",
    "E402", # Module level import not at top - notebooks reorder freely
]
"src/gridiron_edge/sim/**" = [
    "ANN",     # numba @njit functions have complex signatures; skip annotations
    "PLR0912", # Too many branches - inherent to tiebreaker logic
    "PLR0915", # Too many statements - inherent to tiebreaker logic
    "PLR0911", # Too many return statements - inherent to tiebreaker logic
    "D417",    # Missing argument descriptions - numba kernel params are self-describing
]

"src/gridiron_edge/ratings/elo/table.py" = [
    "PLR0912", # Too many branches - Elo table builder iterates many sequential season steps
    "PLR0915", # Too many statements - same rationale
    "E501",    # Long lines - inline season-logic comments exceed 100 chars occasionally
]
"src/gridiron_edge/metrics/travel/travel.py" = [
    "E501",    # Long lines - docstring column specs and fallback-logic comments
]
"src/gridiron_edge/datasets/loaders.py" = [
    "ANN401",  # **read_csv_kwargs: Any - pass-through to pandas; typing the full union adds no value
]
"src/gridiron_edge/datasets/writers.py" = [
    "ANN401",  # **to_csv_kwargs: Any - pass-through to pandas; typing the full union adds no value
]
"src/gridiron_edge/viz/charts.py" = [
    "PLR0912", # Too many branches - build_viz_table_df assembles many conditional data fields
    "PLR0915", # Too many statements - same rationale
]
"src/gridiron_edge/viz/predictions.py" = [
    "PLR0915", # Too many statements - render_predictions_image is a single cohesive render pass
]
"src/gridiron_edge/models/game_prediction/tree.py" = [
    "PLR0912", # Too many branches - _train_random_forest / _train_xgboost have legitimately complex tuning logic
    "PLR0915", # Too many statements - same rationale
]
"src/gridiron_edge/cli.py" = [
    "PLR0912", # run-data-pipeline has many conditional pipeline stages by design
    "PLR0915", # same rationale
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ===========================================================================
# PYREFLY
# ===========================================================================

[tool.pyrefly]
project-includes = ["src"]
python-version = "3.12"
project-excludes = [
    "scripts/**",
    "skills/**"
]
